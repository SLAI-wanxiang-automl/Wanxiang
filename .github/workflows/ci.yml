name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- runtime
  energy-tsf:
    name: energy-tsf (runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/energy-tsf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: CLI smoke
        run: energy-tsf --help

      - name: Import smoke
        run: python -c "import energy_tsf, energy_tsf.cli; print('energy-tsf import ok')"

      - name: Tests
        # The runtime currently has no tests/ directory; run pytest only when present.
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "::warning::packages/energy-tsf has no tests yet (see docs/roadmap.md)"
          fi

  # ----------------------------------------------------------------- engine
  energy-expert:
    name: energy-expert (engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/energy-expert
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --locked

      - name: Rolling-pipeline smoke
        run: uv run python examples/quickstart.py

  # Heavy suite (deep-learning and distributed backends). Manual only.
  energy-expert-full:
    name: energy-expert (full suite)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/energy-expert
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (locked, dev)
        run: uv sync --locked --group dev

      - name: Pytest
        run: |
          uv run pytest -o addopts='' \
            tests/test_data.py tests/test_window_models.py \
            tests/test_backtesting.py tests/test_tuning.py \
            tests/test_test_rolling.py tests/test_pipeline.py \
            tests/test_native_automl.py
